<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fancy Registration Form</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #ece9e6, #ffffff);
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    form {
      max-width: 800px;
      margin: 0 auto;
      background-color: #fff;
      border: 4px solid #4CAF50;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    fieldset {
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 12px;
      border-width: 4px;
    }

    fieldset:nth-of-type(1) {
      border-style: groove;
      border-color: #4CAF50;
      background-color: #f0fff4;
    }

    fieldset:nth-of-type(2) {
      border-style: ridge;
      border-color: #2196F3;
      background-color: #e3f2fd;
    }

    fieldset:nth-of-type(3) {
      border-style: inset;
      border-color: #FF9800;
      background-color: #fff3e0;
    }

    fieldset:nth-of-type(4) {
      border-style: outset;
      border-color: #9C27B0;
      background-color: #f3e5f5;
    }

    legend {
      font-size: 1.2em;
      font-weight: bold;
      padding: 0 10px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: 500;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
    }

    button, input[type="submit"], input[type="reset"] {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 10px;
      font-size: 15px;
    }

    button:hover, input[type="submit"]:hover, input[type="reset"]:hover {
      background-color: #388e3c;
    }
  </style>
</head>
<body>

  <h1>Fancy User Registration</h1>

  <form method="post" action="#" autocomplete="on" target="_blank">

    <fieldset>
      <legend>👤 Personal Info</legend>
      <label for="fname">First Name:</label>
      <input type="text" id="fname" name="firstname" autofocus>

      <label for="lname">Last Name:</label>
      <input type="text" id="lname" name="lastname" readonly value="Test">

      <label for="email">Email:</label>
      <input type="email" id="email" name="email">

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob">
    </fieldset>

    <fieldset>
      <legend>⚙️ Preferences</legend>
      <label>Favorite Language:</label>
      <input type="radio" name="lang" value="HTML"> HTML<br>
      <input type="radio" name="lang" value="CSS"> CSS<br>
      <input type="radio" name="lang" value="JS"> JavaScript<br>

      <label>Devices:</label>
      <input type="checkbox" name="device" value="Bike"> Bike<br>
      <input type="checkbox" name="device" value="Car"> Car<br>
      <input type="checkbox" name="device" value="Boat"> Boat<br>
    </fieldset>

    <fieldset>
      <legend>🎨 Details</legend>
      <label for="color">Favorite Color:</label>
      <input type="color" id="color" name="color">

      <label for="profilepic">Profile Picture:</label>
      <input type="file" id="profilepic" name="profilepic">

      <label for="cars">Select Your Car:</label>
      <select id="cars" name="cars" multiple size="4">
        <option value="toyota">Toyota</option>
        <option value="honda">Honda</option>
        <option value="ford">Ford</option>
        <option value="tesla">Tesla</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>💬 Feedback</legend>
      <label for="feedback">Your Feedback:</label>
      <textarea id="feedback" name="feedback" rows="4"></textarea>

      <label for="satisfaction">Satisfaction Level:</label>
      <input type="range" id="satisfaction" min="0" max="100" value="50" oninput="output.value = satisfaction.value">
      <output id="output">50</output>

      <label for="countrycode">Country Code:</label>
      <input type="text" id="countrycode" name="countrycode" placeholder="e.g. PAK">

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" min="18" max="100">
    </fieldset>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
    <button type="button" onclick="alert('Thanks for your feedback!')">Click Me</button>

  </form>

</body>
</html>
